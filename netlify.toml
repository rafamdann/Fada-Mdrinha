# O site principal está na Vercel (vercel.json); este ficheiro fica para um eventual deploy na Netlify.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Ficheiros com hash (CSS, JS, imagens optimizadas): cache para sempre.
[[headers]]
  for = "/fada-madrinha2/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fada-madrinha2/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fada-madrinha2/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fada-madrinha2/fairy/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML revalidado a cada visita, para alterações de texto ficarem logo visíveis.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# URLs antigos do protótipo
[[redirects]]
  from = "/index.html"
  to = "/fada-madrinha2"
  status = 301
[[redirects]]
  from = "/quem-somos.html"
  to = "/fada-madrinha2/quem-somos"
  status = 301
[[redirects]]
  from = "/servicos.html"
  to = "/fada-madrinha2/servicos"
  status = 301
